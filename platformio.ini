; PlatformIO Project Configuration File — Radar de vuelos
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

; ------------- entorno para la placa -------------
[env:esp32dev]
platform      = espressif32@^6.5.0
board         = esp32dev
framework     = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
  bblanchon/ArduinoJson@^7.0.4
  esphome/ESPAsyncWebServer-esphome@^3.2.2
  esphome/AsyncTCP-esphome@^2.1.4
  bodmer/TFT_eSPI@^2.5.43
  ricmoo/QRCode@^0.0.1
  ; v1.4 no está publicada en el registry de PlatformIO — pin al tag del repo
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
build_flags =
  -DCORE_DEBUG_LEVEL=3           ; INFO
  -std=gnu++17
  ; Config TFT_eSPI para ESP32-2432S028R (Cheap Yellow Display, ILI9341 320x240)
  -DUSER_SETUP_LOADED=1
  -DILI9341_2_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DTFT_INVERSION_ON=1
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DSPI_FREQUENCY=55000000
  ; Panel táctil XPT2046 (bus SPI aparte del TFT en la CYD ESP32-2432S028R).
  ; Prefijo XPT_ (NO TOUCH_) para evitar activar la extensión Touch integrada de
  ; TFT_eSPI: si se define TOUCH_CS, TFT_eSPI incluye su propio Extensions/Touch
  ; y toma el pin en tft.init(); no queremos eso, el driver lo lleva la lib
  ; XPT2046_Touchscreen con su propio SPI (HSPI).
  -DXPT_CS=33
  -DXPT_CLK=25
  -DXPT_MOSI=32
  -DXPT_MISO=39
  -DXPT_IRQ=36
build_unflags =
  -std=gnu++11

; ------------- entorno para tests en desktop -------------
; Los módulos testeables viven en lib/<nombre>/src/ para que el LDF de PlatformIO
; los descubra sin arrastrar main.cpp (que incluye Arduino.h y no compila en native).
; Los tests usan std::string y std::vector puros, así que no requieren ArduinoFake.
[env:native]
platform  = native
test_framework = unity
build_flags =
  -std=gnu++17
  -DUNIT_TEST
  -I test/mocks
lib_deps =
  bblanchon/ArduinoJson@^7.0.4
test_ignore =
